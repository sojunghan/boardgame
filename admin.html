<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 페이지 · 보드게임 소모임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
  <header class="sticky top-0 z-40 border-b-[3px] border-ink bg-nb-blue">
    <div class="wrap flex flex-wrap items-center justify-between gap-3 py-3">
      <h1 class="m-0 rotate-1 rounded-lg border-[3px] border-ink bg-white px-3 py-1 text-2xl shadow-nb sm:text-3xl">🛠 관리자 페이지</h1>
      <div class="flex flex-wrap items-center gap-2">
        <span id="adminBadge" class="badge hidden">관리자 모드</span>
        <a href="index.html" class="btn ghost small">← 모임 페이지</a>
        <button id="logoutBtn" class="btn ghost small hidden">로그아웃</button>
      </div>
    </div>
    <nav id="adminTabs" class="wrap flex gap-3 overflow-x-auto px-4 pb-4 pt-1 hidden">
      <button class="tab active" data-tab="deleted">🗑 삭제된 활동 후기 <span id="deletedCount" class="count"></span></button>
      <button class="tab" data-tab="logs">📜 활동 로그</button>
    </nav>
  </header>

  <div id="setupNotice" class="wrap notice hidden"></div>

  <main class="wrap pb-14 pt-7">
    <!-- 로그인 게이트 -->
    <section id="gate" class="panel">
      <div class="gate-box">
        <h2 class="mb-4 text-2xl">🔐 관리자 로그인</h2>
        <form id="loginForm">
          <label>아이디<input name="email" type="text" required autocomplete="username"></label>
          <label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label>
          <p id="loginError" class="error"></p>
          <button class="btn w-full" type="submit">로그인</button>
          <div class="my-3 text-center text-xs font-extrabold text-ink/50">또는</div>
          <button id="gAdminBtn" type="button" class="btn ghost w-full">Google 계정으로 관리자 로그인</button>
        </form>
      </div>
    </section>

    <!-- 삭제된 활동 후기 (복원) -->
    <section id="tab-deleted" class="panel hidden">
      <p class="hint mb-4 inline-block rounded-lg border-[3px] border-ink bg-white px-3 py-1.5 shadow-nbxs">회원이 삭제한 활동 후기는 여기에 보관돼요. <b>복원</b>하면 다시 목록에 나타나고, <b>영구 삭제</b>하면 되돌릴 수 없어요.</p>
      <div id="deletedList" class="sessions"></div>
    </section>

    <!-- 활동 로그 -->
    <section id="tab-logs" class="panel hidden">
      <div class="toolbar">
        <select id="logFilter">
          <option value="">전체</option>
          <option value="session.">활동 후기</option>
          <option value="review.">게임 후기·평점</option>
          <option value="game.">게임·플레이 횟수</option>
        </select>
        <input id="logSearch" type="search" placeholder="🔍 작성자 / 제목 / 내용 검색">
      </div>
      <p class="hint mb-3">최근 기록순 (최대 300건). 로그는 수정·삭제할 수 없어요.</p>
      <div class="table-wrap">
        <table class="log-table">
          <thead><tr><th>일시</th><th>작성자</th><th>동작</th><th>대상</th><th>내용</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="photoModal" class="modal hidden">
    <div class="modal-box photo-box">
      <button class="close" data-close>&times;</button>
      <img id="photoBig" alt="활동 사진">
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/firebase-config.js?v=21"></script>
  <script src="js/backend-local.js?v=21"></script>
  <script src="js/admin.js?v=21"></script>
</body>
</html>
